name: RelayProof quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check api/plan.js
          node --check tests/safety.test.js
      - name: Run policy tests
        run: node --test